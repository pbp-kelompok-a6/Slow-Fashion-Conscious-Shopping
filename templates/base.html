{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaPAKAIAN</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'global/style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
 <nav class="navbar">
  <a href="{% url 'landing' %}" class="logo">LaPAKAIAN</a>
  <div class="nav-links">
    <a href="#">Katalog</a>
    <a href="#">Kategori</a>
    {% if user.is_authenticated %}
      <a href="{% url 'listing:my_listings' %}" data-seller-nav {% if not user.profile.is_seller %}hidden{% endif %}>My Listings</a>
      <a href="{% url 'profil_toko:toko_saya' %}" data-seller-nav {% if not user.profile.is_seller %}hidden{% endif %}>Toko Saya</a>
      <a href="{% url 'akun:profil' %}">{{ user.username }}</a>
      <a href="{% url 'akun:logout' %}">Keluar</a>
    {% else %}
      <a href="{% url 'akun:login' %}">Masuk</a>
      <a href="{% url 'akun:register' %}">Daftar</a>
    {% endif %}
  </div>
</nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
